name: Publish container image

# Publishes the cart API image to GitHub Container Registry, which is free for
# public packages. Using ghcr.io rather than an Azure Container Registry keeps
# the lab's running cost at zero — an ACR Basic tier bills monthly whether or
# not you pull from it.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}-cart:${{ github.sha }}

      - name: Report the image reference
        run: |
          echo "Deploy this exact reference — a tag can move, a digest cannot:"
          echo "ghcr.io/${{ github.repository }}-cart:${{ github.sha }}"
