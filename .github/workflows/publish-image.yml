name: Publish container image

# Publishes the cart API image to GitHub Container Registry, which is free for
# public packages. Using ghcr.io rather than an Azure Container Registry keeps
# the lab's running cost at zero — an ACR Basic tier bills monthly whether or
# not you pull from it.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute the image reference
        id: image
        # Container registry names must be lowercase, but a GitHub repository
        # name may contain capitals. Lowercase it rather than assuming.
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${repo}-cart:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}

      - name: Report the image reference
        run: |
          echo "Deploy this exact reference — a tag can move, a digest cannot:"
          echo "${{ steps.image.outputs.ref }}"
