name: Copilot setup steps

# The Copilot coding agent reads this file to prepare its environment before it
# starts work. The job MUST be named `copilot-setup-steps` for it to be picked up.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # This repository has no third-party dependencies — app/ and tests/ import
      # only `dataclasses` and `unittest` from the standard library. A repository
      # with a requirements.txt would install it here, and that install is the
      # whole reason this file exists.
